general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.jpg
    color = rgba(000000ff)      # fallback if the image is missing
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.1
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a8bf4aff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 0
    outer_color = rgba(ffffffff)
    inner_color = rgba(000000b3)
    font_color = rgba(ffffffff)
    check_color = rgba(a8bf4aff)
    fail_color = rgba(777777ff)
    fail_text = wrong password
    placeholder_text = <span foreground="##555555">password</span>
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
