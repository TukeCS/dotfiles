# "glow terminal" lock screen: the wallpaper softly blurred, a big monospace clock,
# and a frosted card that looks like a login prompt.

$font  = JetBrainsMono Nerd Font
$text  = rgba(f6ead8ff)
$dim   = rgba(c9bfb0ff)
$gold  = rgba(f4b942ff)
$blue  = rgba(5b82c9ff)
$red   = rgba(e5534bff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.png   # the still wallpaper (or a frame of the live one)
    color = rgba(0e0d0cff)                  # fallback if the image is missing
    blur_passes = 2
    blur_size = 6
    brightness = 0.8
    vibrancy = 0.2
}

# big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000066)
    position = 0, 220
    halign = center
    valign = center
}

# date under it
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr "[:upper:]" "[:lower:]"
    color = $gold
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)
    position = 0, 130
    halign = center
    valign = center
}

# frosted card
shape {
    monitor =
    size = 440, 150
    color = rgba(0e0d0c8c)
    rounding = 6
    border_size = 1
    border_color = rgba(f6ead82e)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(00000059)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##f4b942">❯</span> whoami: <b>$USER</b>
    color = $dim
    font_size = 14
    font_family = $font
    position = 0, -22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    rounding = 3
    outer_color = rgba(f6ead833)
    inner_color = rgba(f6ead814)
    font_color = $text
    font_family = $font
    check_color = $gold
    fail_color = $red
    fail_text = access denied ($ATTEMPTS)
    placeholder_text = <span foreground="##8f8676">password: _</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
