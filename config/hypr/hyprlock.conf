# Matches the Ly login screen: a black box with a moss-green border in the middle
# and the date/time in the top-right corner, over the (unpixelated) wallpaper.

$font  = JetBrainsMono Nerd Font Mono
$text  = rgba(e6e6e6ff)
$dim   = rgba(666666ff)
$moss  = rgba(a8bf4aff)
$red   = rgba(e07a5fff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallpaper.jpg
    color = rgba(000000ff)      # fallback if the image is missing
    blur_passes = 0
    brightness = 0.85
}

# date/time, top right (same as Ly's clock)
label {
    monitor =
    text = cmd[update:1000] date +"%a %d %b  %H:%M"
    color = $text
    font_size = 13
    font_family = $font
    position = -16, -10
    halign = right
    valign = top
}

# the box
shape {
    monitor =
    size = 460, 170
    color = rgba(000000bf)
    rounding = 0
    border_size = 2
    border_color = $moss
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = locked · $USER
    color = $text
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 380, 44
    outline_thickness = 1
    rounding = 0
    outer_color = $dim
    inner_color = rgba(00000000)
    font_color = $text
    font_family = $font
    check_color = $moss
    fail_color = $red
    fail_text = wrong password
    placeholder_text = <span foreground="##666666">password</span>
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    position = 0, -22
    halign = center
    valign = center
}
