# ~/.config/kitty/twilight-peak.conf  --  Twilight Peak (soft)
# kitty.conf: include twilight-peak.conf     Reload: ctrl+shift+F5

font_family      LiberationMono
font_size        11.0

background_opacity      0.95
window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape            beam
cursor_blink_interval   0
enable_audio_bell       no

foreground              #d3cae3
background              #1a1530
selection_foreground    #1a1530
selection_background    #b9a9d6
cursor                  #c9a0b4
cursor_text_color       #1a1530
url_color               #d8b394

active_border_color     #8f7bb8
inactive_border_color   #2e2750
bell_border_color       #d8b394

tab_bar_style           powerline
tab_powerline_style     round
active_tab_foreground   #1a1530
active_tab_background   #b9a0cc
inactive_tab_foreground #8a7fa8
inactive_tab_background #251f40
tab_bar_background      #1a1530

# black
color0  #251f40
color8  #4a4270
# red
color1  #c98a9c
color9  #d8a3b2
# green
color2  #92b8a2
color10 #aecdbb
# yellow
color3  #d8b394
color11 #e4c7ae
# blue
color4  #8a9fd0
color12 #a6b6dd
# magenta
color5  #a98fcb
color13 #bda9da
# cyan
color6  #86b5b8
color14 #a3c8ca
# white
color7  #cfc6df
color15  #e6dff0
