# Twilight Peak (soft) - Hyprlock Configuration

background {
    monitor =
    path = screenshot                     # Takes a snapshot of your desktop and blurs it
    color = rgb(26, 21, 48)               # Fallback background color (#1a1530)
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock (Time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(216, 179, 148)           # Peach (@peach)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(211, 202, 227)           # Text (@text)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = $USER
    color = rgb(138, 127, 168)           # Dim text (@dim)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    
    # Matching active_border gradient from theme.lua (Violet to Rose at 45deg)
    outer_color = rgba(143, 123, 184, 0.85) rgba(201, 160, 180, 0.85) 45deg
    
    # Dark purple pill background (@bg)
    inner_color = rgba(26, 21, 48, 0.85)
    font_color = rgb(211, 202, 227)
    
    fade_on_empty = false
    rounding = 12                         # Rounded corners matching Waybar pill style
    
    # State colors
    check_color = rgb(216, 179, 148)     # Peach on checking
    fail_color = rgb(201, 138, 156)      # Crit/Rose on error (@crit)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    
    placeholder_text = <span foreground="##8a7fa8"><i>Password...</i></span>
    hide_input = false
    
    position = 0, -90
    halign = center
    valign = center
}
