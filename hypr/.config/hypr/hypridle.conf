general {
    lock_cmd = pidof hyprlock || hyprlock       # What to run when locking
    before_sleep_cmd = loginctl lock-session    # Lock the screen before sleeping
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn screen back on when waking
}

# Auto-sleep after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = loginctl suspend
}
